# Build and test on every push to main and every pull request. No secrets and no signing keys: every input is public
# and pinned by sha256 in dependencies.lock (cluster-tools by commit and source tarball, the money schema by core
# commit, Boost, OpenSSL and libpq by source tarball), and scripts/fetch-cluster-tools.sh and scripts/build-deps.sh
# refuse anything else before it is built.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uuid-dev ninja-build

      - name: Restore the cluster-tools package built from the lock
        id: ct-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ct-prefix
          key: cluster-tools-${{ runner.os }}-${{ hashFiles('dependencies.lock', 'scripts/build-cluster-tools.sh', 'scripts/fetch-cluster-tools.sh') }}

      - name: Fetch and verify cluster-tools by the lock
        # the verified tree also carries the golden corpus the codec tests read (GW_CLUSTER_TOOLS_SOURCE_DIR)
        run: |
          set -euo pipefail
          scripts/fetch-cluster-tools.sh "${RUNNER_TEMP}/ct-cache" --verify-only > "${RUNNER_TEMP}/ct-args"
          echo "CT_SOURCE_DIR=$(sed -n 's/^-DCLUSTER_TOOLS_SOURCE_DIR=//p' "${RUNNER_TEMP}/ct-args")" >> "$GITHUB_ENV"

      - name: Build and install the pinned cluster-tools package
        if: steps.ct-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" scripts/build-cluster-tools.sh "${RUNNER_TEMP}/ct-cache" "${RUNNER_TEMP}/ct-prefix"

      - name: Restore the Boost, OpenSSL and libpq prefix built from the lock
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps-prefix
          key: gateway-deps-${{ runner.os }}-${{ hashFiles('dependencies.lock', 'scripts/build-deps.sh') }}

      - name: Build Boost, OpenSSL and libpq from the pinned tarballs
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" scripts/build-deps.sh "${RUNNER_TEMP}/deps-cache" "${RUNNER_TEMP}/deps-prefix"

      - name: Configure
        # the configure checks the package against the lock again (source sha, money schema sha256 and version), and
        # the deps prefix (its stamp and version headers); the users-store tests run PostgreSQL in docker
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/ct-prefix" -DGW_TEST_BUILDS=ON
          -DGW_CLUSTER_TOOLS_SOURCE_DIR="${CT_SOURCE_DIR}" -DGW_DEPS_PREFIX="${RUNNER_TEMP}/deps-prefix" -DGW_PG_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Footprint at idle (reported, not asserted)
        run: python3 -I tests/process/process_test.py --bin-dir build/bin --work build/footprint footprint

  # The unit tests (the wire codec cases and its fuzz case included) under AddressSanitizer and UndefinedBehavior
  # Sanitizer. The cluster-tools package comes from the same lock, cache and verified tree as build-test.
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SAN_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uuid-dev ninja-build

      - name: Restore the cluster-tools package built from the lock
        id: ct-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ct-prefix
          key: cluster-tools-${{ runner.os }}-${{ hashFiles('dependencies.lock', 'scripts/build-cluster-tools.sh', 'scripts/fetch-cluster-tools.sh') }}

      - name: Fetch and verify cluster-tools by the lock
        run: |
          set -euo pipefail
          scripts/fetch-cluster-tools.sh "${RUNNER_TEMP}/ct-cache" --verify-only > "${RUNNER_TEMP}/ct-args"
          echo "CT_SOURCE_DIR=$(sed -n 's/^-DCLUSTER_TOOLS_SOURCE_DIR=//p' "${RUNNER_TEMP}/ct-args")" >> "$GITHUB_ENV"

      - name: Build and install the pinned cluster-tools package
        if: steps.ct-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" scripts/build-cluster-tools.sh "${RUNNER_TEMP}/ct-cache" "${RUNNER_TEMP}/ct-prefix"

      - name: Restore the Boost, OpenSSL and libpq prefix built from the lock
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps-prefix
          key: gateway-deps-${{ runner.os }}-${{ hashFiles('dependencies.lock', 'scripts/build-deps.sh') }}

      - name: Build Boost, OpenSSL and libpq from the pinned tarballs
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" scripts/build-deps.sh "${RUNNER_TEMP}/deps-cache" "${RUNNER_TEMP}/deps-prefix"

      - name: Configure (ASan + UBSan)
        run: >-
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/ct-prefix" -DGW_TEST_BUILDS=OFF
          -DGW_CLUSTER_TOOLS_SOURCE_DIR="${CT_SOURCE_DIR}" -DGW_DEPS_PREFIX="${RUNNER_TEMP}/deps-prefix"
          -DCMAKE_C_FLAGS="${SAN_FLAGS}" -DCMAKE_CXX_FLAGS="${SAN_FLAGS}"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build the unit tests
        run: cmake --build build-san --target gw_unit_tests

      - name: Unit tests under the sanitizers (wire codec and fuzz included)
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: build-san/bin/gw_unit_tests
